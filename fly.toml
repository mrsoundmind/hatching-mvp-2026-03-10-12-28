app = "hatchin-mvp"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  STORAGE_MODE = "db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # min=0 → machine fully stops when idle, saves ~$6.48/mo while pre-public.
  # Cold start adds ~3-5s for the first visitor after an idle window.
  # Flip back to 1 once we start driving real public traffic.
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
