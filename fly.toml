app = "hatchin-mvp"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  STORAGE_MODE = "db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # min=1 since 2026-08-10. At min=0 the machine fully stopped and the first
  # visitor after an idle window waited ~14s (measured, not the ~3-5s
  # originally assumed) and could hit a failed dynamic import mid-boot.
  # Costs ~$6.48/mo (₹557). Drop back to 0 if this goes dormant again.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  # Tier 0.6 (OBS-2) — pull a wedged / DB-unreachable instance from rotation. Target is /health, NOT
  # /api/health: the latter sits behind the `app.use('/api', requireAuth)` guard and 401s for an
  # unauthenticated prober, which would make Fly kill every instance. /health is the same handler
  # (DB ping + 503 only when infra is down; an LLM-provider outage stays 200 so a still-serviceable
  # instance is not killed). grace_period covers cold start under min_machines_running = 0.
  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "15s"
    timeout = "4s"
    grace_period = "20s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
